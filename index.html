<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a1a" />
  <meta name="description" content="SK EXAMS COUNTDOWN - Live countdown for NEET, JEE & custom dates. Reminders, progress & more." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SK Countdown" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏳</text></svg>" />
  <title>SK EXAMS COUNTDOWN</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <canvas id="particles-canvas"></canvas>
  <div class="gradient-overlay"></div>
  <button class="exit-fs-btn" id="exit-fs-btn" title="Exit Fullscreen">✕</button>

  <div class="app">
    <header class="header">
      <div class="logo">SK EXAMS COUNTDOWN</div>
      <div class="header-actions">
        <button class="icon-btn" id="share-header-btn" title="Share">↗</button>
        <button class="icon-btn" id="theme-btn" title="Toggle Theme">☀️</button>
      </div>
    </header>

    <main class="main">
      <!-- LIST VIEW -->
      <section id="list-view" class="view active">
        <h1 class="page-title">All Exam Countdowns</h1>
        <p class="page-subtitle">Select an exam or create your own countdown</p>

        <div class="exam-card custom-card" id="custom-card">
          <div class="exam-card-left">
            <h3>✨ Custom Countdown</h3>
            <p>Set your own date & time</p>
          </div>
          <div class="exam-card-right">→</div>
        </div>

        <div id="saved-customs" class="saved-section"></div>

        <div class="exam-list" id="exam-list">
          <p class="loading">Loading exams...</p>
        </div>
      </section>

      <!-- CUSTOM FORM VIEW -->
      <section id="custom-form-view" class="view">
        <div class="countdown-header">
          <button class="back-btn" id="custom-back-btn" title="Back">←</button>
          <h2 class="countdown-title">Create Custom Countdown</h2>
        </div>
        <div class="custom-form">
          <div class="form-group">
            <label for="custom-title">Title</label>
            <input type="text" id="custom-title" placeholder="e.g. My Exam, Birthday" maxlength="40" />
          </div>
          <div class="form-group">
            <label for="custom-date">Date</label>
            <input type="date" id="custom-date" required />
          </div>
          <div class="form-group">
            <label for="custom-time">Time</label>
            <input type="time" id="custom-time" value="00:00" />
          </div>
          <label class="checkbox-row">
            <input type="checkbox" id="custom-save" checked />
            <span>Save for later (this device)</span>
          </label>
          <button class="primary-btn" id="start-custom-btn">Start Countdown</button>
        </div>
      </section>

      <!-- COUNTDOWN VIEW -->
      <section id="countdown-view" class="view">
        <div class="countdown-header">
          <button class="back-btn" id="back-btn" title="Back">←</button>
          <h2 class="countdown-title" id="countdown-title">Countdown</h2>
        </div>

        <div class="countdown-container">
          <div class="progress-wrap">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <p class="progress-text" id="progress-text"></p>

          <div class="timer-grid">
            <div class="timer-box">
              <div class="timer-value" id="days">00</div>
              <div class="timer-label">Days</div>
            </div>
            <div class="timer-box">
              <div class="timer-value" id="hours">00</div>
              <div class="timer-label">Hours</div>
            </div>
            <div class="timer-box">
              <div class="timer-value" id="minutes">00</div>
              <div class="timer-label">Minutes</div>
            </div>
            <div class="timer-box">
              <div class="timer-value" id="seconds">00</div>
              <div class="timer-label">Seconds</div>
            </div>
          </div>

          <p class="target-date" id="target-date">Target: —</p>
          <p class="quote" id="motivation-quote"></p>

          <div class="action-row">
            <button class="action-btn" id="remind-btn" title="Browser reminder">🔔 Remind me</button>
            <button class="action-btn" id="share-btn" title="Share">↗ Share</button>
            <button class="action-btn" id="sound-btn" title="Last seconds sound">🔊 Sound</button>
            <button class="action-btn" id="fullscreen-btn" title="Fullscreen">⛶ Full</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="branding">
      <p class="made-by">Made with ✨ by</p>
      <a href="https://t.me/The_Sk08" target="_blank" rel="noopener noreferrer" class="brand-link">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM16.64 8.8C16.49 10.38 15.84 14.22 15.51 15.99C15.37 16.74 15.09 16.99 14.83 17.01C14.25 17.07 13.81 16.64 13.25 16.27C12.37 15.69 11.87 15.33 11.02 14.77C10.03 14.12 10.67 13.76 11.24 13.18C11.39 13.03 13.95 10.7 14 10.49C14.0069 10.4657 14.006 10.4391 13.9975 10.4154C13.9889 10.3917 13.973 10.3716 13.952 10.358C13.9 10.33 13.83 10.34 13.73 10.38C13.6 10.43 11.48 11.84 10.67 12.38C10.5 12.49 10.3 12.54 10.11 12.52C9.87 12.5 9.22 12.33 8.82 12.21C8.36 12.07 7.97 11.99 8.03 11.68C8.07 11.5 8.3 11.31 8.64 11.12C10.64 10.14 12.94 9.14 14.18 8.6C15.18 8.18 16.1 8.05 16.4 8.4C16.5 8.5 16.55 8.67 16.5 8.8H16.64Z" fill="#2AABEE"/>
        </svg>
        <span class="brand-text">THE SK 08</span>
      </a>
    </footer>
  </div>

  <div id="toast" class="toast"></div>
  <script src="./js/script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
